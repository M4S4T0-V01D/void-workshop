[package]
name = "void-workshop"
version = "0.3.0"
description = "VOID Workshop: local approval-first AI coding workspace"
authors = ["M4S4T0-V01D"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "void_workshop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
